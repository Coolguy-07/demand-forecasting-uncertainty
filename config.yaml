# ---------------------------------------------------------------------------
# Demand Forecasting with Uncertainty Quantification - configuration
# All stages of the pipeline read their settings from this file.
# ---------------------------------------------------------------------------

seed: 42
num_threads: 8

data:
  # Rossmann Store Sales (Kaggle competition data, mirrored publicly - no auth).
  # Original: https://www.kaggle.com/competitions/rossmann-store-sales
  urls:
    train: "https://huggingface.co/datasets/AiiN-aini/rossmann-store-sales/resolve/main/train.csv"
    store: "https://huggingface.co/datasets/AiiN-aini/rossmann-store-sales/resolve/main/store.csv"
  expected_rows: 1017209
  expected_stores: 1115

paths:
  raw_dir: "data/raw"
  cache_dir: "data/cache"
  outputs_dir: "outputs"
  models_dir: "outputs/models"
  tables_dir: "outputs/tables"
  figures_dir: "reports/figures"

# Time-based split (no shuffling - the future must stay in the future).
splits:
  train_end: "2015-04-30"   # train:  2013-01-01 .. 2015-04-30
  valid_end: "2015-05-31"   # valid:  2015-05-01 .. 2015-05-31  |  test: 2015-06-01 .. 2015-07-31

features:
  lags: [1, 2, 3, 6, 7, 8, 14, 21, 28, 35, 42, 56, 364]
  rolling_windows: [7, 14, 28]
  std_windows: [7, 28]
  same_dow_weeks: 4          # mean of the previous 4 same-weekday observations
  promo_history_days: 7

# Quantile levels modelled by gradient boosting (pinball/quantile loss).
quantiles: [0.05, 0.10, 0.25, 0.50, 0.75, 0.90, 0.95]

# Prediction intervals built from the quantiles above.
intervals:
  - {name: "50", lo: 0.25, hi: 0.75, nominal: 0.50}
  - {name: "80", lo: 0.10, hi: 0.90, nominal: 0.80}
  - {name: "90", lo: 0.05, hi: 0.95, nominal: 0.90}

model:
  n_estimators: 1500
  learning_rate: 0.05
  num_leaves: 63
  min_child_samples: 40
  feature_fraction: 0.8
  bagging_fraction: 0.85
  bagging_freq: 1
  lambda_l1: 0.1
  lambda_l2: 1.0
  early_stopping_rounds: 100

decision:
  # newsvendor-style cost ratios: shortage_cost = ratio * overage_cost
  cost_ratios: [1, 2, 3, 4, 6, 9, 15, 25]
  overage_cost: 1.0
  plot_ratio_max: 25

analysis:
  spike_train_quantile: 0.95   # "demand spike" := actual >= store's train-period p95
